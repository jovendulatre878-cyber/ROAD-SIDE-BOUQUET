<script>
const SUPABASE_URL = "https://mfgsuppsxqukymxafmde.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_QftaNSdWPgOi7ql2575Dzw_ML5D4xnv";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const grid = document.getElementById("bouquetGrid");
const statusEl = document.getElementById("catalogStatus");
const categoryGrid = document.getElementById("categoryGrid");
const selectedCategoryTitle = document.getElementById("selectedCategoryTitle");
const showAllButton = document.getElementById("showAllCategories");
const detailModal = document.getElementById("bouquetDetailModal");
let allBouquets = [];
let activeCategory = null;
let selectedBouquet = null;
document.getElementById("year").textContent = new Date().getFullYear();
const money = (value) => new Intl.NumberFormat("en-PH",{style:"currency",currency:"PHP",maximumFractionDigits:2}).format(Number(value||0));
function safeText(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}
const categoryDefaults = [
 {name:"Valentines Bouquet",image:"https://images.unsplash.com/photo-1518895949257-7621c3c786d7?auto=format&fit=crop&w=700&q=80"},
 {name:"Teachers Day Bouquet",image:"https://images.unsplash.com/photo-1494972308805-463bc619d34e?auto=format&fit=crop&w=700&q=80"},
 {name:"Mothers Day Bouquet",image:"https://images.unsplash.com/photo-1525310072745-f49212b5ac6d?auto=format&fit=crop&w=700&q=80"},
 {name:"Graduation Bouquet",image:"https://images.unsplash.com/photo-1561181286-d3fee7d55364?auto=format&fit=crop&w=700&q=80"},
 {name:"Bridal Bouquet",image:"https://images.unsplash.com/photo-1523438885200-e635ba2c371e?auto=format&fit=crop&w=700&q=80"},
 {name:"All Saints All Souls Bouquet",image:"https://images.unsplash.com/photo-1508610048659-a06b669e3321?auto=format&fit=crop&w=700&q=80"}
];
function categoryName(item){return String(item.category||"Other Bouquets").trim()||"Other Bouquets";}
function renderCategories(){
 const counts = allBouquets.reduce((acc,item)=>{const c=categoryName(item);acc[c]=(acc[c]||0)+1;return acc;},{});
 const names = [...new Set([...categoryDefaults.map(c=>c.name),...Object.keys(counts).filter(c=>!categoryDefaults.some(d=>d.name.toLowerCase()===c.toLowerCase()))])];
 categoryGrid.innerHTML=names.map(name=>{
  const defaultItem=categoryDefaults.find(c=>c.name.toLowerCase()===name.toLowerCase());
  const first=allBouquets.find(item=>categoryName(item).toLowerCase()===name.toLowerCase()&&item.image_url);
  const image=safeText(first?.image_url||defaultItem?.image||categoryDefaults[0].image);
  const count=counts[name]||0;
  return `<button class="category-card ${activeCategory===name?'active':''}" type="button" data-category="${safeText(name)}"><img src="${image}" alt="${safeText(name)}" loading="lazy"><span>${safeText(name)}</span><small>${count} ${count===1?'bouquet':'bouquets'}</small></button>`;
 }).join("");
 categoryGrid.querySelectorAll("[data-category]").forEach(button=>button.addEventListener("click",()=>{activeCategory=button.dataset.category;renderCategories();renderBouquets(allBouquets.filter(item=>categoryName(item).toLowerCase()===activeCategory.toLowerCase()));selectedCategoryTitle.textContent=activeCategory;showAllButton.hidden=false;grid.scrollIntoView({behavior:"smooth",block:"start"});}));
}
function openDetails(item){selectedBouquet=item;document.getElementById("detailBouquetImage").src=item.image_url||"";document.getElementById("detailBouquetImage").alt=item.name||"Bouquet";document.getElementById("detailBouquetCategory").textContent=categoryName(item);document.getElementById("detailBouquetName").textContent=item.name||"Signature Bouquet";document.getElementById("detailBouquetPrice").textContent=money(item.price);document.getElementById("detailBouquetDescription").textContent=item.description||"A thoughtful arrangement made with care.";detailModal.classList.add("open");document.body.style.overflow="hidden";}
function closeDetails(){detailModal.classList.remove("open");document.body.style.overflow="";}
document.getElementById("closeBouquetDetail")?.addEventListener("click",closeDetails);
detailModal?.addEventListener("click",event=>{if(event.target===detailModal)closeDetails();});
document.addEventListener("keydown",event=>{if(event.key==="Escape")closeDetails();});
showAllButton?.addEventListener("click",()=>{activeCategory=null;renderCategories();grid.innerHTML="";selectedCategoryTitle.textContent="All bouquet categories";showAllButton.hidden=true;statusEl.textContent="Choose a category above to browse its bouquets.";});
function renderBouquets(items){
 if(!items?.length){grid.innerHTML='<div class="empty">No bouquets in this category yet. Please check back soon.</div>';return;}
 grid.innerHTML=items.map((item,index)=>{
  const name=safeText(item.name||"Signature Bouquet");const description=safeText(item.description||"A thoughtful arrangement made with care.");const image=safeText(item.image_url||"");
  return `<article class="card"><div class="card-image"><img src="${image}" alt="${name}" loading="lazy" onerror="this.style.display='none'"><span class="pill">${safeText(categoryName(item))}</span></div><div class="card-content"><div class="card-title-row"><h3>${name}</h3><span class="price">${money(item.price)}</span></div><p>${description}</p><button class="btn btn-outline" type="button" data-bouquet-index="${allBouquets.indexOf(item)}">View details</button></div></article>`;
 }).join("");
 grid.querySelectorAll("[data-bouquet-index]").forEach(button=>button.addEventListener("click",()=>openDetails(allBouquets[Number(button.dataset.bouquetIndex)])));
}
document.getElementById("detailOrderButton")?.addEventListener("click",async()=>{
 if(!selectedBouquet)return;
 sessionStorage.setItem("roadside_selected_bouquet_id",String(selectedBouquet.id));sessionStorage.setItem("roadside_selected_bouquet_name",selectedBouquet.name||"Signature Bouquet");closeDetails();
 const {data:{session}}=await supabaseClient.auth.getSession();
 if(!session){window.location.href="buyer-login-supabase-fixed.html?next=roadside_bouquet_builder.html";return;}
 window.location.href="roadside_bouquet_builder.html";
});
async function loadBouquets(){
 try{
  const {data,error}=await supabaseClient.from("prebuilt_bouquets").select("id,name,description,price,image_url,is_active,display_order,category").eq("is_active",true).order("display_order",{ascending:true});
  if(error) throw error;allBouquets=data||[];renderCategories();grid.innerHTML="";statusEl.textContent=allBouquets.length?"Choose a category to explore our ready-made bouquets.":"No active bouquets have been added yet.";
 }catch(error){console.warn("Could not load Supabase bouquet catalog:",error.message);statusEl.textContent="Could not load the live bouquet collection. Check the category column and Supabase permissions.";categoryGrid.innerHTML=categoryDefaults.map(c=>`<button class="category-card" type="button" data-category="${safeText(c.name)}"><img src="${c.image}" alt="${safeText(c.name)}"><span>${safeText(c.name)}</span><small>Browse bouquets</small></button>`).join("");categoryGrid.querySelectorAll("[data-category]").forEach(button=>button.addEventListener("click",()=>{activeCategory=button.dataset.category;selectedCategoryTitle.textContent=activeCategory;showAllButton.hidden=false;grid.innerHTML='<div class="empty">Please check the Supabase category column and bouquet records.</div>';}));}
}
loadBouquets();
</script>
